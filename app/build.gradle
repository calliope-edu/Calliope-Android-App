import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk = 36

    defaultConfig {
        applicationId = "cc.calliope.mini"
        minSdk = 24
        targetSdk = 36
        versionCode = 27
        versionName = '2.0.9'

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    namespace = 'cc.calliope.mini'
}

dependencies {
    implementation libs.nordic.ble.scanner
    implementation libs.nordic.dfu

    // Explicit lifecycle artifacts (previously pulled transitively; the old
    // lifecycle-extensions:2.2.0 is deprecated and frozen since 2019).
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.service
    implementation libs.lifecycle.process
    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx
    implementation libs.preference.ktx

    implementation libs.documentfile
    implementation libs.localbroadcastmanager
    implementation libs.material

    // QR scanning — open source (Apache-2.0), on-device, no Play Services.
    implementation libs.zxing.embedded

    // Loopback Scratch Link server for scratch-based editors —
    // open source (MIT), on-device, no Play Services.
    implementation libs.java.websocket
}